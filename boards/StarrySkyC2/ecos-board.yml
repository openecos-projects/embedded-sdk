schema: 2
id: starrysky-c2
name: StarrySky C2
aliases:
  - c2
category: StarrySkyC2
arch: riscv
target: ysyx-c2

build:
  default_profile: flash-xip
  profiles:
    flash-xip:
      kconfig:
        LINK_RAM_REGION_SRAM: y
    psram-data:
      kconfig:
        LINK_RAM_REGION_PSRAM: y
  components:
    - bsp-legacy-console

resources:
  console:
    driver: driver-uart
    instance: 0
  i2c-bus:
    driver: driver-i2c
    controller: 0
  qspi-bus:
    driver: driver-qspi
    controller: 0
    clock_divider: 3
  soft-spi-bus:
    driver: soft-spi
    chip_select:
      controller: 0
      pin: 0
    clock:
      controller: 0
      pin: 1
    mosi:
      controller: 0
      pin: 2
    miso:
      controller: 0
      pin: 3
    mode: 0
  display:
    driver: device-st7735
    bus: qspi-bus
    chip_select: 0
    dc_gpio:
      controller: 0
      pin: 2
    width: 128
    height: 128
    rotation: 0
    horizontal_offset: 2
    vertical_offset: 3
  display-st7789:
    driver: device-st7789
    bus: qspi-bus
    chip_select: 0
    dc_gpio:
      controller: 0
      pin: 0
    reset_gpio:
      controller: 0
      pin: 1
    width: 240
    height: 240
    rotation: 2
  pwm-output:
    driver: driver-pwm
    controller: 0
    channel: 0
    gpio:
      controller: 0
      pin: 0

monitor:
  baudrate: 115200

kconfig:
  board: sdk/board.kconfig
