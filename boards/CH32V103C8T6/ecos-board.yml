schema: 2
id: ch32v103c8t6
name: CH32V103C8T6 minimal board (experimental)
aliases:
  - ch32v103-c8t6
category: CH32V103
arch: riscv
target: ch32v103
build:
  default_profile: flash
  profiles:
    - flash
  components:
    - bsp-ch32v103c8t6
resources:
  console:
    driver: driver-uart
    instance: 0
  gpio-demo:
    driver: driver-gpio
    input:
      controller: 0
      pin: 0
      label: PA0
      idle_level: low
    output:
      controller: 0
      pin: 1
      label: PA1
      initial_level: low
  i2c-bus:
    driver: driver-i2c
    controller: 0
    clock_divider: 80
  spi-bus:
    driver: driver-spi
    controller: 0
    clock_hz: 1000000
    mode: 0
    bit_order: msb-first
    cs_gpio:
      controller: 0
      pin: 4
monitor:
  baudrate: 115200
flash:
  provider: wlink
  artifact: hex
  chip: CH32V103
  unprotect: true
  erase: true
