schema: 1
id: ch32v103
name: CH32V103 (experimental)
arch: riscv
description: Experimental CH32V103C8T6 target with polling USART1, GPIOA-D basic GPIO, I2C1, SPI1, TIM2 polling, and IWDG support; interrupt and clock-accuracy validation pending.
cpu:
  march: rv32imac_zicsr_zifencei
  abi: ilp32
toolchain:
  prefix: riscv-none-elf-
  triple: riscv-none-elf
memory:
  flash:
    origin: 0x00000000
    size: 64K
  sram:
    origin: 0x20000000
    size: 20K
build:
  cmake: CMakeLists.txt
  toolchain_file: toolchain.cmake
  kconfig: Kconfig
  linker_script: linker/sections.lds
  startup: startup/start.S
  sources:
    - startup/start.S
  capability_sources:
    adc:
      - hal/adc/adc.c
    gpio:
      - hal/gpio/gpio.c
    i2c:
      - hal/i2c/i2c.c
    pwm:
      - hal/pwm/pwm.c
    rtc:
      - hal/rtc/rtc.c
    spi:
      - hal/spi/spi.c
    timer:
      - hal/timer/timer.c
    wdg:
      - hal/wdg/wdg.c
    uart:
      - hal/uart/uart.c
  capability_include_dirs:
    adc:
      - ../../../hal/adc/include
    gpio:
      - ../../../hal/gpio/include
    i2c:
      - ../../../hal/i2c/include
    pwm:
      - ../../../hal/pwm/include
    rtc:
      - ../../../hal/rtc/include
    spi:
      - ../../../hal/spi/include
    timer:
      - ../../../hal/timer/include
    wdg:
      - ../../../hal/wdg/include
    uart:
      - ../../../hal/uart/include
  outputs:
    - elf
    - bin
    - hex
    - txt
    - map
    - size
    - compile_commands
capabilities:
  - adc
  - uart
  - gpio
  - i2c
  - pwm
  - rtc
  - spi
  - timer
  - wdg
