schema: 1
id: cl1-2512
name: CL1-2512
arch: riscv
description: SoC target used by StarrySky T1-Pico.
cpu:
  march: rv32imc_zicsr_zifencei
  abi: ilp32
toolchain:
  prefix: riscv-none-elf-
  triple: riscv-none-elf
memory:
  flash:
    origin: 0x20000000
    size: 16M
  isram:
    origin: 0x01000000
    size: 16K
  dsram:
    origin: 0x01800000
    size: 16K
  sdram:
    origin: 0x80000000
    size: 32M
build:
  cmake: CMakeLists.txt
  toolchain_file: toolchain.cmake
  kconfig: Kconfig
  linker_script: linker/sections.lds
  startup: startup/start.S
  sources:
    - startup/start.S
    - startup/early_init.c
  include_dirs:
    - include
  capability_sources:
    clint:
      - hal/clint/clint.c
    gpio:
      - hal/gpio/gpio.c
    gpio-interrupt:
      - hal/gpio/gpio_interrupt.c
    i2c:
      - hal/i2c/i2c.c
    interrupt:
      - hal/interrupt/interrupt.c
      - hal/interrupt/trap.S
    qspi:
      - hal/qspi/qspi.c
    rcu:
      - hal/rcu/rcu.c
    rcu-pll:
      - hal/rcu/rcu.c
    timer:
      - hal/timer/timer.c
    timer-interrupt:
      - hal/timer/timer_interrupt.c
    uart:
      - hal/uart/uart.c
    sdram:
      - hal/sdram/sdram.c
  capability_include_dirs:
    clint:
      - ../../../hal/clint/include
    gpio:
      - ../../../hal/gpio/include
    gpio-interrupt:
      - ../../../hal/gpio/include
      - ../../../hal/gpio_interrupt/include
    i2c:
      - ../../../hal/i2c/include
    interrupt:
      - ../../../hal/interrupt/include
    qspi:
      - ../../../hal/qspi/include
    rcu:
      - ../../../hal/rcu/include
    rcu-pll:
      - ../../../hal/rcu/include
    timer:
      - ../../../hal/timer/include
    timer-interrupt:
      - ../../../hal/interrupt/include
      - ../../../hal/timer/include
    uart:
      - ../../../hal/uart/include
    sdram:
      - ../../../hal/sdram/include
  outputs:
    - elf
    - bin
    - hex
    - txt
    - map
    - size
    - compile_commands
capabilities:
  - clint
  - uart
  - gpio
  - gpio-interrupt
  - interrupt
  - plic
  - i2c
  - qspi
  - rcu
  - rcu-pll
  - timer
  - timer-interrupt
  - sdram
