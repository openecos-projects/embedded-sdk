schema: 1
id: ysyx-l3
name: ysyx L3
arch: riscv
description: Legacy StarrySky L3 SoC target migrated to the SDK 3.0 build graph.
cpu:
  march: rv64ifd_zifencei
  abi: lp64
toolchain:
  prefix: riscv-none-elf-
  triple: riscv-none-elf
memory:
  flash:
    origin: 0x30000000
    size: 16M
  mem:
    origin: 0x80000000
    size: 128M
build:
  cmake: CMakeLists.txt
  toolchain_file: toolchain.cmake
  kconfig: Kconfig
  linker_script: linker/sections.lds
  startup: startup/start.S
  sources:
    - startup/start.S
  include_dirs:
    - include
  capability_sources:
    gpio:
      - ../legacy-common/hal/gpio.c
    i2c:
      - ../legacy-common/hal/i2c.c
    uart:
      - ../legacy-common/hal/uart.c
  capability_include_dirs:
    gpio:
      - ../../../hal/gpio/include
    i2c:
      - ../../../hal/i2c/include
    uart:
      - ../../../hal/uart/include
  outputs:
    - elf
    - bin
    - hex
    - txt
    - map
    - size
    - compile_commands
capabilities:
  - ram-64k
  - uart
  - gpio
  - i2c
