schema: 1
id: ysyx-2512-2
name: ysyx-2512-2
arch: riscv
description: SoC target used by StarrySky L4C3.
cpu:
  march: rv32e
  abi: ilp32e
toolchain:
  prefix: riscv-none-elf-
  triple: riscv-none-elf
memory:
  flash:
    origin: 0x30000000
    size: 16M
  psram:
    origin: 0xC0000000
    size: 8M
build:
  cmake: CMakeLists.txt
  toolchain_file: toolchain.cmake
  kconfig: Kconfig
  linker_script: linker/sections.lds
  startup: startup/start.S
  loader: startup/loader.c
  sources:
    - startup/start.S
    - startup/loader.c
  include_dirs:
    - include
  capability_sources:
    archinfo:
      - hal/archinfo/archinfo.c
    crc:
      - hal/crc/crc.c
    gpio:
      - hal/gpio/gpio.c
    i2c:
      - hal/i2c/i2c.c
    pwm:
      - hal/pwm/pwm.c
    qspi:
      - hal/qspi/qspi.c
    rng:
      - hal/rng/rng.c
    rcu:
      - hal/rcu/rcu.c
    rtc:
      - hal/rtc/rtc.c
    timer:
      - hal/timer/timer.c
    uart:
      - hal/uart/uart.c
  capability_include_dirs:
    archinfo:
      - ../../../hal/archinfo/include
      - ../../../hal/archinfo
    crc:
      - ../../../hal/crc/include
      - ../../../hal/crc
    gpio:
      - ../../../hal/gpio/include
    i2c:
      - ../../../hal/i2c/include
    pwm:
      - ../../../hal/pwm
    qspi:
      - ../../../hal/qspi/include
    rng:
      - ../../../hal/rng/include
      - ../../../hal/rng
    rcu:
      - ../../../hal/rcu/include
    rtc:
      - ../../../hal/rtc/include
    timer:
      - ../../../hal/timer/include
    uart:
      - ../../../hal/uart/include
  outputs:
    - elf
    - bin
    - hex
    - txt
    - map
    - size
    - compile_commands
capabilities:
  - uart
  - gpio
  - hp-uart
  - i2c
  - pwm
  - qspi
  - timer
  - archinfo
  - rng
  - crc
  - rcu
  - rtc
