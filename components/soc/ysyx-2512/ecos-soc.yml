schema: 1
id: ysyx-2512
name: ysyx-2512
arch: riscv
description: SoC target used by StarrySky L4.
cpu:
  march: rv32e
  abi: ilp32e
toolchain:
  prefix: riscv-none-elf-
  triple: riscv-none-elf
memory:
  flash:
    origin: 0x30000000
    size: 16M
  psram:
    origin: 0xC0000000
    size: 8M
build:
  cmake: CMakeLists.txt
  toolchain_file: toolchain.cmake
  kconfig: Kconfig
  linker_script: linker/sections.lds
  startup: startup/start.S
  loader: startup/loader.c
  sources:
    - startup/start.S
    - startup/loader.c
  include_dirs:
    - include
  capability_sources:
    gpio:
      - hal/gpio/gpio.c
    i2c:
      - hal/i2c/i2c.c
    pwm:
      - hal/pwm/pwm.c
    timer:
      - hal/timer/timer.c
    uart:
      - hal/uart/uart.c
  capability_include_dirs:
    gpio:
      - ../../../hal/gpio/include
    i2c:
      - ../../../hal/i2c/include
    pwm:
      - ../../../hal/pwm
    timer:
      - ../../../hal/timer/include
    uart:
      - ../../../hal/uart/include
  outputs:
    - elf
    - bin
    - hex
    - txt
    - map
    - size
    - compile_commands
capabilities:
  - uart
  - gpio
  - hp-uart
  - i2c
  - pwm
  - qspi
  - timer
  - archinfo
  - rng
  - crc
