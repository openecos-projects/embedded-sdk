schema: 1
id: ysyx-c2
name: ysyx C2
arch: riscv
description: Legacy StarrySky C2 SoC target migrated to the SDK 3.0 build graph.
cpu:
  march: rv32im
  abi: ilp32
toolchain:
  prefix: riscv-none-elf-
  triple: riscv-none-elf
memory:
  flash:
    origin: 0x00000000
    size: 16M
  sram:
    origin: 0x30000000
    size: 128K
  psram:
    origin: 0x40000000
    size: 8M
build:
  cmake: CMakeLists.txt
  toolchain_file: toolchain.cmake
  kconfig: Kconfig
  linker_script: linker/sections.lds
  startup: startup/start.S
  sources:
    - startup/start.S
  include_dirs:
    - include
  capability_sources:
    archinfo:
      - ../legacy-common/hal/archinfo.c
    gpio:
      - ../legacy-common/hal/gpio.c
    i2c:
      - ../legacy-common/hal/i2c.c
    pwm:
      - ../legacy-common/hal/pwm.c
    qspi:
      - ../legacy-common/hal/qspi.c
    timer:
      - ../legacy-common/hal/timer.c
    uart:
      - ../legacy-common/hal/uart.c
  capability_include_dirs:
    archinfo:
      - ../../../hal/archinfo/include
    gpio:
      - ../../../hal/gpio/include
    i2c:
      - ../../../hal/i2c/include
    pwm:
      - ../../../hal/pwm/include
    qspi:
      - ../../../hal/qspi/include
    timer:
      - ../../../hal/timer/include
    uart:
      - ../../../hal/uart/include
  outputs:
    - elf
    - bin
    - hex
    - txt
    - map
    - size
    - compile_commands
capabilities:
  - ram-64k
  - rv32im-exec-sram
  - uart
  - gpio
  - hp-uart
  - i2c
  - pwm
  - qspi
  - timer
  - archinfo
