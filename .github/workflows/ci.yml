name: SDK 3.0 CI

on:
  push:
    branches: [main, v3.0, '3.0.1']
  pull_request:
    branches: [main, v3.0, '3.0.1']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  host:
    name: ${{ matrix.runner }} install and build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - macos-15-intel
          - macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install SDK, run CLI tests, and build in a Unicode path
        if: matrix.runner != 'ubuntu-24.04'
        run: python tools/ci_host_smoke.py --report ci-report.json
      - name: Build and package all compatible examples for L4C1, T1-Pico, and C2
        if: matrix.runner == 'ubuntu-24.04'
        run: >-
          python tools/ci_host_smoke.py
          --board starrysky-l4-c1
          --board starrysky-t1-pico
          --board starrysky-c2
          --report ci-report.json --firmware-dir ci-firmware
      - name: Build experimental CH32V103 peripheral and PFIC interrupt examples
        if: matrix.runner == 'ubuntu-24.04'
        run: >-
          python tools/ci_host_smoke.py
          --board ch32v103c8t6
          --report ch32v103-ci-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: ecos-ci-${{ matrix.runner }}
          path: ci-report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.runner == 'ubuntu-24.04'
        with:
          name: ecos-firmware-matrix-${{ github.sha }}
          path: ci-firmware
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.runner == 'ubuntu-24.04'
        with:
          name: ecos-ci-ch32v103-${{ github.sha }}
          path: ch32v103-ci-report.json
          if-no-files-found: error

  python-minimum:
    name: Python 3.9 install and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Install SDK, run CLI tests, and build in a Unicode path
        run: python tools/ci_host_smoke.py --report ci-report-py39.json
      - uses: actions/upload-artifact@v4
        with:
          name: ecos-ci-python-3.9-ubuntu-24.04
          path: ci-report-py39.json
          if-no-files-found: error

  extension:
    name: VS Code extension unit and package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/vscode-ecos/package-lock.json
      - run: npm ci
        working-directory: tools/vscode-ecos
      - run: npm test
        working-directory: tools/vscode-ecos
      - run: npm run package
        working-directory: tools/vscode-ecos
