# 定义 StartySky T1-Pico 内置板卡清单。
schema: 2
id: startysky-t1-pico
name: StartySky T1-Pico
aliases:
  - t1-pico
category: StartySkyT1Pico
arch: riscv
target: cl1-2512

# SDK 3.0 默认使用 Flash XIP 和 DSRAM 数据布局。
build:
  default_profile: flash_xip
  profiles:
    - flash_xip
  components:
    - bsp-startysky-t1-pico

# 板载 LED 位于 GPIOD4、低电平点亮；Button 位于 GPIOA7，暂未注册为 Button BSP 资源。
resources:
  console:
    driver: driver-uart
    instance: 0
  gpio-demo:
    driver: driver-gpio
    input:
      controller: 0
      pin: 7
    output:
      controller: 3
      pin: 4
  i2c-bus:
    driver: driver-i2c
    controller: 0
  led:
    driver: driver-gpio
    active_level: low
    instances:
      - id: 0
        controller: 3
        pin: 4

flash:
  provider: mass-storage
  artifact: bin
  volume_label: YSYX-HFPLnk
  copy_count: 2
  settle_seconds: 0.5

monitor:
  baudrate: 115200

files:
  # 2.x compatibility entry; SDK 3.0 projects use the CL1-2512 Target files.
  makefile: Makefile
  board_header: board.h
  linker_script: sections.lds
  startup: start.S
  build_conf: build_conf.mk

# 声明板卡和驱动配置入口。
kconfig:
  board: board.kconfig
  drivers: driver.kconfig

# 声明板卡驱动和加载器目录。
paths:
  drivers: driver
  loader: loader
