schema: 2
id: starrysky-l4
name: StarrySky L4
aliases:
  - l4
category: StarrySkyL4
arch: riscv
target: ysyx-2512

build:
  default_profile: memory

resources:
  console:
    driver: sys-uart
    instance: 0

files:
  makefile: Makefile
  board_header: board.h
  linker_script: sections.lds
  startup: start.S
  build_conf: build_conf.mk

kconfig:
  board: board.kconfig
  drivers: driver.kconfig

paths:
  loader: loader

abstract_machine:
  path: environments/abstract-machine
  default_core: rv32e-base
