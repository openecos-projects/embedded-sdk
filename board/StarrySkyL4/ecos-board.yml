schema: 2
id: starrysky-l4
name: StarrySky L4
aliases:
  - l4
category: StarrySkyL4
arch: riscv
target: ysyx-2512

build:
  default_profile: memory
  components:
    - bsp-starrysky-l4

resources:
  button:
    driver: driver-gpio
    active_level: low
    idle_level: high
    instances:
      - id: 0
        controller: 1
        pin: 7
      - id: 1
        controller: 1
        pin: 8
  console:
    driver: driver-uart
    instance: 0
  led:
    driver: driver-gpio
    active_level: low
    instances:
      - id: 0
        controller: 1
        pin: 5
      - id: 1
        controller: 1
        pin: 6

flash:
  provider: mass-storage
  artifact: bin
  volume_label: YSYX-HFPLnk
  copy_count: 2
  settle_seconds: 0.5

monitor:
  baudrate: 115200

files:
  # 2.x compatibility entry; 3.0 ordinary projects use the Target CMake files.
  makefile: Makefile
  board_header: board.h
  linker_script: sections.lds
  startup: start.S
  build_conf: build_conf.mk

kconfig:
  board: board.kconfig
  drivers: driver.kconfig

paths:
  loader: loader

abstract_machine:
  path: environments/abstract-machine
  default_core: rv32e-base
